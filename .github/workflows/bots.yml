name: Test bots

# Nothing starts this on its own: tests.yml runs it on the stock engine for a
# push to a branch other than main, build.yml on the stripped engine (the
# engine cuts in build_conf/, what the exports ship) for main, pull requests
# and tags. With engine "stripped" the caller has uploaded the Linux debug
# template as the artifact template-linux-debug; the game runs on it from a
# freshly exported pack (.github/scripts/run_stripped_bots.sh). Both callers bring their
# own concurrency, so this one has none.
on:
  workflow_call:
    inputs:
      mapgen_seeds:
        description: "Seeds per map type and player count in the map generation sweep"
        type: string
        default: "12"
      bots:
        description: "Which bots to run, space separated; empty for all of them"
        type: string
        default: ""
      engine:
        description: "stock (Godot's own build) or stripped (needs the artifact template-linux-debug)"
        type: string
        default: stock
  workflow_dispatch:
    inputs:
      mapgen_seeds:
        description: "Seeds per map type and player count in the map generation sweep"
        type: string
        default: "12"
      bots:
        description: "Which bots to run, space separated; empty for all of them"
        type: string
        default: ""

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"

jobs:
  # Fetches Godot once so the bots below only have to restore it. The cache key
  # is the one build.yml and balance.yml use, so they share one copy -- which
  # is why the export templates are in it too, even though no bot needs them.
  # (The stripped engine runs the game, but the stock editor exports its pack.)
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot & export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $TPL
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* $TPL/

  # Stripped engine only: the game as a pack, exported by the stock editor,
  # beside the stripped Linux debug template the caller built. Every job
  # below runs the bots on these two (artifact stripped-linux).
  pack:
    if: inputs.engine == 'stripped'
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Restore Godot
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
          fail-on-cache-miss: true

      - uses: actions/download-artifact@v8
        with:
          name: template-linux-debug
          path: build/stripped/templates

      - name: Export the pack
        run: |
          ~/godot --headless --import 2>&1 | tail -5
          ~/godot --headless --export-pack "Linux" build/stripped/game.pck
          test -s build/stripped/game.pck
          cp build/stripped/templates/linux_debug.x86_64 build/stripped/godot.template_debug
          ls -lh build/stripped

      - uses: actions/upload-artifact@v7
        with:
          name: stripped-linux
          path: |
            build/stripped/game.pck
            build/stripped/godot.template_debug
          if-no-files-found: error
          retention-days: 3

  # gdlint over every GDScript file (tests/lint.sh, rules in .gdlintrc). It
  # needs no Godot, so it starts at once; a finding fails the run like a bot.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install gdtoolkit
        run: pip install gdtoolkit==4.5.0

      - name: Lint
        run: tests/lint.sh

  # Map generation, on its own: the unit tests of MapData, GenContext, the save
  # format and pathing, and then a sweep over many seeds that makes one attempt
  # per map, so the numbers are the generator's real first-try hit rate rather
  # than what Config.MAP_TRIES hides. GEN_PROFILE makes it time its own stages.
  # A failed run gets a second one, as the bots below (the timeout fits both).
  mapgen:
    needs: [setup, pack]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.pack.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Restore Godot
        if: inputs.engine != 'stripped'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
          fail-on-cache-miss: true

      - name: Import assets
        if: inputs.engine != 'stripped'
        run: ~/godot --headless --import 2>&1 | tail -5

      - name: Fetch the stripped engine and the pack
        if: inputs.engine == 'stripped'
        uses: actions/download-artifact@v8
        with:
          name: stripped-linux
          path: build/stripped

      - name: Generate maps
        env:
          OUT: ${{ github.workspace }}/logs
          GEN_PROFILE: "1"
          MAPGEN_SEEDS: ${{ inputs.mapgen_seeds || '12' }}
          MAPGEN_BUDGET_MS: "1500000"
          TIMEOUT: "2100"
          CI: "true"  # (the bots skip their machine-dependent timing checks)
          RETRY: all  # (a failed run gets a second one, which decides; see tests/run_all.sh)
        run: |
          if [ "${{ inputs.engine }}" = stripped ]; then
            .github/scripts/run_stripped_bots.sh mapgen
          else
            GODOT=~/godot tests/run_all.sh mapgen
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-mapgen
          path: logs
          retention-days: 14

  # One job per bot, so a slow one does not hold up the rest and every log comes
  # back as its own artifact even when the bot fails. A failed run gets one
  # second run (RETRY): failing again fails the job, and with it the run; passing
  # passes it with a warning that carries the first run's error (flaky). The
  # timeout fits two runs.
  bots:
    needs: [setup, pack]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.pack.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        bot: [build, library, stats, save, map_format, editor, world, title, coop, net, tutorial, scenario, military, enemy, aqua, siege, advancement, rat, hud, sim]
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Restore Godot
        if: inputs.engine != 'stripped'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
          fail-on-cache-miss: true

      - name: Import assets
        if: inputs.engine != 'stripped'
        run: ~/godot --headless --import 2>&1 | tail -5

      - name: Fetch the stripped engine and the pack
        if: inputs.engine == 'stripped'
        uses: actions/download-artifact@v8
        with:
          name: stripped-linux
          path: build/stripped

      - name: Run the ${{ matrix.bot }} bot
        if: ${{ inputs.bots == '' || contains(format(' {0} ', inputs.bots), format(' {0} ', matrix.bot)) }}
        env:
          OUT: ${{ github.workspace }}/logs
          TIMEOUT: "2700"
          CI: "true"  # (the bots skip their machine-dependent timing checks)
          RETRY: all  # (a failed run gets a second one, which decides; see tests/run_all.sh)
        run: |
          if [ "${{ inputs.engine }}" = stripped ]; then
            .github/scripts/run_stripped_bots.sh ${{ matrix.bot }}
          else
            GODOT=~/godot tests/run_all.sh ${{ matrix.bot }}
          fi

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: logs-${{ matrix.bot }}
          path: logs
          if-no-files-found: ignore
          retention-days: 14

  # The balancing bot (docs/balance-bot-design.md) as a smoke test: five short
  # games of different kinds, each has to get through wave 5 alive. Two are
  # fixed (the same game every run: a change that breaks it is the culprit),
  # three get a random seed and map (printed in the log: rerun it with the same
  # --map / --seeds to see it again). No hard games: the bot dies before wave 5
  # in about a fifth of them, so there it would only test the dice. Like the bots
  # above, a failed game is played once more (same map and seed): failing again
  # fails the run, passing passes it with a warning carrying the first error.
  balance-smoke:
    needs: [setup, pack]
    if: ${{ !cancelled() && needs.setup.result == 'success' && needs.pack.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: fixed-temperate, map: temperate, seed: "1", difficulty: normal, policy: balanced}
          - {name: fixed-coast, map: coast, seed: "2", difficulty: easy, policy: archers}
          - {name: random-melee, map: random, seed: random, difficulty: normal, policy: melee}
          - {name: random-mages, map: random, seed: random, difficulty: easy, policy: mages}
          - {name: random-holy, map: random, seed: random, difficulty: normal, policy: holy}
    steps:
      - uses: actions/checkout@v7
        with:
          lfs: true

      - name: Restore Godot
        if: inputs.engine != 'stripped'
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}
          fail-on-cache-miss: true

      - name: Import assets
        if: inputs.engine != 'stripped'
        run: ~/godot --headless --import 2>&1 | tail -5

      - name: Fetch the stripped engine and the pack
        if: inputs.engine == 'stripped'
        uses: actions/download-artifact@v8
        with:
          name: stripped-linux
          path: build/stripped

      - name: Play five waves (${{ matrix.name }})
        if: ${{ inputs.bots == '' || contains(format(' {0} ', inputs.bots), ' balance ') }}
        run: |
          SEED="${{ matrix.seed }}"
          if [ "$SEED" = random ]; then SEED=$(( (RANDOM * 32768 + RANDOM) % 90000 + 1000 )); fi
          echo "map=${{ matrix.map }} seed=$SEED difficulty=${{ matrix.difficulty }} policy=${{ matrix.policy }}" | tee -a "$GITHUB_STEP_SUMMARY"
          mkdir -p logs
          godot=(~/godot)
          if [ "${{ inputs.engine }}" = stripped ]; then
            chmod +x build/stripped/godot.template_debug
            godot=(build/stripped/godot.template_debug --main-pack build/stripped/game.pck)
          fi
          NAME=balance-smoke-${{ matrix.name }}
          play() {
            "${godot[@]}" --headless --fixed-fps 60 res://tools/balance_bot.tscn -- \
              --map=${{ matrix.map }} --seeds=$SEED --difficulty=${{ matrix.difficulty }} --policy=${{ matrix.policy }} \
              --max-waves=5 --require-waves=5 --no-detail --out=logs/$NAME.jsonl 2>&1 | tee logs/$NAME.log
            return ${PIPESTATUS[0]}
          }
          play && exit 0
          FIRST=$?
          mv logs/$NAME.log logs/$NAME.first.txt
          rm -f logs/$NAME.jsonl
          echo "=== first game failed (exit code $FIRST); playing it once more ==="
          play || exit $?
          # The second game passed: a warning with what the first one failed with
          # (its FAIL and error lines, else the end of its log).
          ERR="exit code $FIRST"$'\n'"$(grep -E -A6 "FAIL|SCRIPT ERROR|Parse Error|ERROR:" logs/$NAME.first.txt || tail -n 40 logs/$NAME.first.txt)"
          echo "WARNING: passed on the second try; the first game failed with:"
          echo "$ERR" | sed 's/^/    /'
          echo ":warning: **$NAME passed on the second try** (flaky); the first game failed with:" >> "$GITHUB_STEP_SUMMARY"
          printf '\n```\n%s\n```\n' "$ERR" >> "$GITHUB_STEP_SUMMARY"
          ERR=${ERR//'%'/'%25'}; ERR=${ERR//$'\r'/'%0D'}; ERR=${ERR//$'\n'/'%0A'}
          echo "::warning title=$NAME passed on the second try (flaky)::The first game failed; the second passed. First game: $ERR"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: balance-smoke-${{ matrix.name }}
          path: logs
          if-no-files-found: ignore
          retention-days: 14

  # Everything the bots printed, in one place: what failed and where in the bot
  # it was checked, the engine errors, and the map generation tables. It runs
  # even when bots failed (their jobs fail the run), so the failures are listed
  # in one place. A run that produced no logs at all is an error too, because
  # then nothing was tested and the summary would be an empty all clear.
  summary:
    needs: [bots, mapgen]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: logs
          pattern: logs-*
          merge-multiple: false

      - name: Summarize
        run: |
          python3 tests/summarize.py logs --source-dir tests \
            --markdown summary.md --json report.json
          head -c 900000 summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: summary
          path: |
            summary.md
            report.json
          retention-days: 90
