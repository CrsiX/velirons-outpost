name: Build

# The builds players get, on the stripped engine: Godot built from source with
# the engine cuts in build_conf/ (smaller files), one export template per job
# (.github/actions/stripped-template: from the cache, or built and cached).
#
#   bots      - the Linux debug template runs every bot (bots.yml, engine
#               "stripped"); a failure fails the run but holds up no build
#   export    - Linux, Windows and Web release, Android debug: one artifact
#               each, velirons-outpost-<name>; on a tag also Android release
#               (velirons-outpost-android-release), signed with the release
#               key from the secrets ANDROID_RELEASE_KEYSTORE (base64),
#               ANDROID_RELEASE_KEY_ALIAS and ANDROID_RELEASE_KEY_PASSWORD
#   pages     - the Web debug build (it has the Debug page), deployed to
#               GitHub Pages on a push to main, without waiting for the bots
#   release   - on a tag (v*): a GitHub release named after the tag's
#               message (tag v0.1.0 "Release v0.1.0"), with the release
#               builds only (.x86_64, .exe, .apk, the web build as a .zip);
#               it waits for every export and for the bots to pass
#
# Other branches run the bots on Godot's stock engine instead (tests.yml).
# The weekly schedule only touches the seven template caches: GitHub drops a
# cache nobody used for a week, and building one again takes hours.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

env:
  # The stock editor that exports: the same release as GODOT_TAG, as fdroid.yaml
  # exports with an editor built from that tag (not the cache bots.yml uses).
  GODOT_VERSION: "4.7.2"
  GODOT_TAG: "4.7.2-stable"   # the Godot source the templates are built from, as in fdroid.yaml

jobs:
  # The template the bots run on; handed to bots.yml as an artifact.
  bots-template:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/stripped-template
        with:
          platform: linux
          kind: debug
          godot-tag: ${{ env.GODOT_TAG }}

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'schedule'
        with:
          name: template-linux-debug
          path: build/stripped/templates/linux_debug.x86_64
          if-no-files-found: error
          retention-days: 3

  bots:
    needs: bots-template
    if: github.event_name != 'schedule'
    uses: ./.github/workflows/bots.yml
    with:
      engine: stripped

  export:
    name: export ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 240 # (most of it only when the template has to be built)
    env:
      # Whether this run exports (else it only fills the template cache).
      EXPORT: ${{ github.event_name != 'schedule' && (!matrix.tag-only || startsWith(github.ref, 'refs/tags/v')) }}
    strategy:
      fail-fast: false # a broken platform should not hide the state of the others
      matrix:
        include:
          - {name: linux, platform: linux, kind: release, out: build/linux/velirons-outpost.x86_64}
          - {name: windows, platform: windows, kind: release, out: build/windows/velirons-outpost.exe}
          - {name: android, platform: android, kind: debug, out: build/android/velirons-outpost.apk}
          # Exported only on a tag (for the release), but its template cache is
          # kept warm by every run like the others.
          - {name: android-release, platform: android, kind: release, out: build/android-release/velirons-outpost.apk, tag-only: true}
          - {name: web, platform: web, kind: release, out: build/web/index.html}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0 # the whole history and the tags: the stamp names the latest tag

      - uses: ./.github/actions/stripped-template
        with:
          platform: ${{ matrix.platform }}
          kind: ${{ matrix.kind }}
          godot-tag: ${{ env.GODOT_TAG }}

      - uses: ./.github/actions/stock-godot
        if: env.EXPORT == 'true'
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      # --- Android only ----------------------------------------------------
      # Exported like fdroid.yaml does (the "F-Droid" preset, unsigned; see
      # export-stripped.sh), then signed with the SDK's apksigner: a fresh
      # debug key for debug, the project's key (secrets) for release. No
      # Gradle or NDK here (gradle_build/use_gradle_build=false).
      # The same OpenJDK as the template build and fdroid.yaml.
      - name: Set up the JDK
        if: env.EXPORT == 'true' && matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-21-jdk-headless
          echo "JAVA_HOME=/usr/lib/jvm/java-21-openjdk-amd64" >> "$GITHUB_ENV"
          echo "/usr/lib/jvm/java-21-openjdk-amd64/bin" >> "$GITHUB_PATH"

      # fdroid.yaml's postbuild tools, reproducible-apk-tools at its srclib's tag.
      - name: Reproducible-build tools
        if: env.EXPORT == 'true' && matrix.platform == 'android'
        run: |
          sudo apt-get update
          sudo apt-get install -y strip-nondeterminism
          git clone -q --depth 1 --branch v0.3.0 \
            https://github.com/obfusk/reproducible-apk-tools.git "$RUNNER_TEMP/reproducible-apk-tools"
          echo "REPRO_APK_TOOLS=$RUNNER_TEMP/reproducible-apk-tools" >> "$GITHUB_ENV"

      - name: Point Godot at the Android SDK and a signing key
        if: env.EXPORT == 'true' && matrix.platform == 'android'
        env:
          KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: |
          # These two are editor settings with no command-line switch, so write
          # the file the editor would have written. Godot fills in every other
          # setting from its defaults. 4.x has shipped under both of these names
          # for this file, and an unread copy costs nothing.
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          cp ~/.config/godot/editor_settings-4.tres ~/.config/godot/editor_settings-$(echo "$GODOT_VERSION" | cut -d. -f1,2).tres
          mkdir -p ~/.android
          if [ "${{ matrix.kind }}" = release ]; then
            # The release key: always the same one, or players can't update.
            if [ -z "$KEYSTORE" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
              echo "::error::Android release export needs the secrets ANDROID_RELEASE_KEYSTORE (base64), ANDROID_RELEASE_KEY_ALIAS and ANDROID_RELEASE_KEY_PASSWORD"
              exit 1
            fi
            echo "$KEYSTORE" | base64 -d > ~/.android/release.keystore
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$KEY_ALIAS"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
          else
            keytool -keyalg RSA -genkeypair -alias androiddebugkey \
              -keypass android -keystore ~/.android/debug.keystore \
              -storepass android -dname "CN=Android Debug,O=Android,C=US" \
              -validity 9999 -deststoretype pkcs12
            {
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
              echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
            } >> "$GITHUB_ENV"
          fi
      # ---------------------------------------------------------------------

      # Stamps the version (BuildInfo), exports with the stripped template, and
      # checks the file is there: Godot's exporter has been known to warn its
      # way to exit code 0.
      - name: Export ${{ matrix.name }} (${{ matrix.kind }})
        if: env.EXPORT == 'true'
        run: GODOT=$HOME/godot .github/scripts/export-stripped.sh ${{ matrix.platform }} ${{ matrix.kind }} ${{ matrix.out }}

      - uses: actions/upload-artifact@v4
        if: env.EXPORT == 'true'
        with:
          name: velirons-outpost-${{ matrix.name }}
          # Windows' console wrapper (and the web build's other files) are part
          # of the build: upload the whole directory.
          path: build/${{ matrix.name }}/
          if-no-files-found: error

  # A release for a tag, once every export is done and the bots passed; named
  # after the tag's message (its first line); a
  # lightweight tag, with no message, falls back to the tag's name. Pushing a
  # tag again updates the release's files.
  release:
    needs: [export, bots]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      # checkout leaves an annotated tag as a lightweight one: fetch it as it is.
      - name: Read the tag's message
        id: tag
        run: |
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          title=""
          if [ "$(git cat-file -t "$TAG")" = tag ]; then
            title=$(git tag -l --format='%(contents:subject)' "$TAG")
          fi
          echo "title=${title:-$TAG}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          pattern: velirons-outpost-*
          path: artifacts

      - name: Gather the files
        run: |
          mkdir release
          a=artifacts/velirons-outpost
          cp "$a-linux/velirons-outpost.x86_64" "release/velirons-outpost-$TAG.x86_64"
          cp "$a-windows/velirons-outpost.exe" "release/velirons-outpost-$TAG.exe"
          cp "$a-android-release/velirons-outpost.apk" "release/velirons-outpost-$TAG.apk"
          (cd "$a-web" && zip -r -9 "$GITHUB_WORKSPACE/release/velirons-outpost-$TAG-web.zip" .)
          ls -lh release

      - name: Publish the release
        env:
          TITLE: ${{ steps.tag.outputs.title }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --title "$TITLE"
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --verify-tag --title "$TITLE" --notes "$TITLE"
          fi

  # The Web debug build for GitHub Pages: built on every run (a pull request
  # finds out whether it exports), deployed only from main.
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - uses: ./.github/actions/stripped-template
        with:
          platform: web
          kind: debug
          godot-tag: ${{ env.GODOT_TAG }}

      - uses: ./.github/actions/stock-godot
        if: github.event_name != 'schedule'
        with:
          godot-version: ${{ env.GODOT_VERSION }}

      - name: Export Web (debug)
        if: github.event_name != 'schedule'
        run: GODOT=$HOME/godot .github/scripts/export-stripped.sh web debug build/pages/index.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'schedule'
        with:
          path: build/pages

  deploy:
    needs: pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
