name: Build

# Desktop and mobile builds. The Web build lives in pages.yml, which exports it
# and deploys it straight to GitHub Pages; the platforms that have to be
# downloaded instead are built here.

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GODOT_VERSION: "4.7"

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false # a broken platform should not hide the state of the others
      matrix:
        include:
          - name: linux
            preset: Linux
            out: build/linux/velirons-outpost.x86_64
          - name: windows
            preset: Windows Desktop
            out: build/windows/velirons-outpost.exe
          - name: android
            preset: Android
            out: build/android/velirons-outpost.apk

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      # The same cache key as pages.yml, on purpose: Godot and its templates are
      # a gigabyte, and one download should serve every job of both workflows.
      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}

      - name: Download Godot & export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          BASE=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          wget -q $BASE/Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          unzip -q Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot
          TPL=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p $TPL
          unzip -q Godot_v${GODOT_VERSION}-stable_export_templates.tpz
          mv templates/* $TPL/

      # --- Android only ----------------------------------------------------
      # The preset sets gradle_build/use_gradle_build=false, so Godot packs the
      # prebuilt template APK and needs neither Gradle nor the NDK. It does need
      # the SDK's zipalign and apksigner, and a JDK to run apksigner with.

      - name: Set up the JDK
        if: matrix.name == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Point Godot at the Android SDK
        if: matrix.name == 'android'
        run: |
          # These two are editor settings with no command-line switch, so write
          # the file the editor would have written. Godot fills in every other
          # setting from its defaults.
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          # 4.x has shipped under both of these names for this file, and an
          # unread copy costs nothing.
          cp ~/.config/godot/editor_settings-4.tres \
             ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          cat ~/.config/godot/editor_settings-4.tres

      - name: Android signing keys
        if: matrix.name == 'android'
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          # package/signed=true, so an unsigned APK is not on the table, and
          # without the editor here nothing has created a debug keystore yet.
          mkdir -p ~/.android
          keytool -keyalg RSA -genkeypair -alias androiddebugkey \
            -keypass android -keystore ~/.android/debug.keystore \
            -storepass android -dname "CN=Android Debug,O=Android,C=US" \
            -validity 9999 -deststoretype pkcs12
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android"
          } >> "$GITHUB_ENV"
          # A real release APK only if the three secrets are set. Without them
          # the job still hands back an installable debug APK instead of going
          # red, which is what a fork or a first run wants.
          if [ -n "$RELEASE_KEYSTORE" ]; then
            echo "$RELEASE_KEYSTORE" | base64 -d > ~/.android/release.keystore
            {
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$HOME/.android/release.keystore"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$RELEASE_USER"
              echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$RELEASE_PASSWORD"
              echo "SIGNED_RELEASE=1"
            } >> "$GITHUB_ENV"
          else
            echo "::warning title=Unsigned Android build::No ANDROID_KEYSTORE_BASE64 secret, exporting a debug APK."
          fi
      # ---------------------------------------------------------------------

      - name: Import assets
        run: ~/godot --headless --import

      - name: Export ${{ matrix.preset }}
        env:
          PRESET: ${{ matrix.preset }}
          OUT: ${{ matrix.out }}
          PLATFORM: ${{ matrix.name }}
        run: |
          mkdir -p "$(dirname "$OUT")"
          mode=--export-release
          if [ "$PLATFORM" = android ] && [ -z "$SIGNED_RELEASE" ]; then
            mode=--export-debug # a debug keystore cannot sign a release build
          fi
          ~/godot --headless $mode "$PRESET" "$OUT"
          # Godot's exporter has been known to warn its way to exit code 0, so
          # take the file itself as the proof.
          test -s "$OUT"
          ls -lh "$(dirname "$OUT")"

      - uses: actions/upload-artifact@v4
        with:
          name: velirons-outpost-${{ matrix.name }}
          # The desktop presets have binary_format/embed_pck=false, so the .pck
          # beside the binary (and Windows' console wrapper) is part of the
          # build, not a leftover: upload the whole directory.
          path: build/${{ matrix.name }}/
          if-no-files-found: error
