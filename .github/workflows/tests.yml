name: Tests

# Every bot on Godot's stock engine, for a push to any branch but main: quick,
# no engine to build. main, pull requests and tags test the stripped engine the
# exports ship instead (build.yml), so they are left out here.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bots:
    uses: ./.github/workflows/bots.yml

  all-bots:
    needs: bots
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "bots: ${{ needs.bots.result }}"
          [ "${{ needs.bots.result }}" = "success" ]
